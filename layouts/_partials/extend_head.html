<!-- Theme CSS variables (from data/themes/) -->
{{- partial "theme_vars.html" . -}}

<!-- GitHub Pages serves http too unless "Enforce HTTPS" is on -->
<script>if (location.protocol === "http:" && location.hostname === "moonlapse.net") location.protocol = "https:";</script>
<meta name="color-scheme" content="dark" />
{{- with site.Params.statusURL }}{{ with urls.Parse . }}
<!-- The server status fetch is anonymous CORS, so the preconnect must be too -->
<link rel="preconnect" href="{{ .Scheme }}://{{ .Host }}" crossorigin />
{{- end }}{{ end }}
<link rel="manifest" href="/site.webmanifest" />
{{- if .IsHome }}{{ with partial "screenshot_file.html" .Params.hero_shot.name }}
<!-- The largest thing on the homepage: ahead of the fonts and the logo -->
<link rel="preload" as="image" href="{{ .res.RelPermalink }}" fetchpriority="high" />
{{- end }}{{ else }}
<!-- The body font, so long pages are less likely to re-wrap when it arrives. Not on the homepage, where it would hold up the big screenshot -->
<link rel="preload" href="/fonts/JTUSjIg1_i6t8kCHKm459Wlhyw.woff2" as="font" type="font/woff2" crossorigin />
{{- end }}

<!-- Starfield size: 1:1 with screen pixels, or a whole multiple on 2x+ screens (see custom.css) -->
<script>
  (function () {
    function size() {
      var dpr = window.devicePixelRatio || 1;
      var scale = Math.max(1, Math.floor(dpr));
      document.documentElement.style.setProperty("--bg-size", (1920 * scale / dpr) + "px");
    }
    // only when the display scale changes (zoom, another screen), not on every resize: phones
    // resize whenever the address bar comes or goes, mid-scroll
    (function watch() {
      size();
      if (window.matchMedia)
        matchMedia("(resolution: " + (window.devicePixelRatio || 1) + "dppx)")
          .addEventListener("change", watch, { once: true });
    })();
  })();
</script>

<!-- The visitor's platform, as a platform id in data/release.toml: "" on phones and tablets (iPads
     say they're Macs), which can't run the client -->
<script>
  window.moonlapsePlatform = function () {
    var ua = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || navigator.userAgent;
    var mobile = (navigator.userAgentData && navigator.userAgentData.mobile) ||
      /android|iphone|ipad|ipod|mobile/i.test(navigator.userAgent) || (/mac/i.test(ua) && navigator.maxTouchPoints > 1);
    if (mobile) return "";
    if (/mac/i.test(ua)) return "macos-arm64";
    if (/linux/i.test(ua)) return "linux-x64";
    return "windows-x64";
  };
</script>

<!-- The footer's script cancels the jump to a "#" link (to scroll smoothly), so the skip link moves focus itself -->
<script>
  document.addEventListener("click", function (e) {
    if (e.target.closest(".skip-link")) document.getElementById("main").focus({ preventScroll: true });
  });
</script>

<!-- External links open in a new tab -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll("a[href]").forEach(function (a) {
      if (!a.hostname || a.hostname === location.hostname) return;
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener noreferrer");
      if (a.classList.contains("btn") || a.closest(".menu") || a.querySelector("img, svg")) return;
      a.insertAdjacentHTML("beforeend",
        ' <svg class="ext" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24" height="10" width="10" aria-hidden="true"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"></path><path d="M15 3h6v6"></path><path d="M10 14L21 3"></path></svg>');
    });
  });
</script>
