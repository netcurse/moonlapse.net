{{- /* (dict "n" 2 "alt" "..." "sizes" "<sizes attribute>" "eager" false) */ -}}
{{- $s := partial "screenshot_set.html" .n -}}
<a class="shot" href="{{ $s.full.RelPermalink }}" data-lightbox>
  <img src="{{ $s.fallback.RelPermalink }}" srcset="{{ $s.srcset }}" sizes="{{ .sizes | default "100vw" }}"
    width="{{ $s.fallback.Width }}" height="{{ $s.fallback.Height }}" alt="{{ .alt }}"
    {{- if .eager }} fetchpriority="high" {{- else }} loading="lazy" {{- end }} decoding="async" />
</a>
