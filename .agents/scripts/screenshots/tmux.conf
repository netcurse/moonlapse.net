# The screenshot terminal's tmux (start.sh): the whole window is the game, and F12 saves it.
set -g status off
set -g mouse off
set -g display-time 3000
set -sg escape-time 0
# a terminal that lets the client set its own colours (init_color), as foot does
set -g default-terminal "xterm-256color"
set -as terminal-features ',foot*:RGB'
# line drawing as UTF-8, not the terminal's line-drawing set
set-environment -g NCURSES_NO_UTF8_ACS 1
bind -n F12 run-shell -b '"$MOONLAPSE_SCREENSHOTS/shot.sh" capture "#{pane_id}"'
